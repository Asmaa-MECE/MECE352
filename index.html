<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MECE 352 Lectures 1 &amp; 2 Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--fg:#1c2230;--mut:#667085;--bd:#dde1ea;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161d;--card:#1c212b;--fg:#e8ebf2;--mut:#98a2b3;--bd:#2f3646;--ac:#7c97ff;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1b1b}}
:root[data-theme="dark"]{--bg:#13161d;--card:#1c212b;--fg:#e8ebf2;--mut:#98a2b3;--bd:#2f3646;--ac:#7c97ff;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1b1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.q h3{font-size:1rem;margin:0 0 10px}
.q h3 span{color:var(--ac);margin-right:6px}
label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;margin-top:7px;cursor:pointer}
label:hover{border-color:var(--ac)}
label.ok{background:var(--okb);border-color:var(--ok)}
label.no{background:var(--nob);border-color:var(--no)}
input{margin-top:5px}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
#score{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;font-size:1.15rem;font-weight:600}
.n{color:var(--mut);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>MECE 352 — Lectures 1 &amp; 2 Quiz</h1>
<p class="sub">Control Systems Intro · Mathematical Modelling &amp; Transfer Function · 15 random questions from a bank of 100</p>
<div id="score"></div>
<div id="quiz"></div>
<div class="bar">
<button id="new" class="alt">New random 15</button>
</div>
</main>
<script>
const B=[
["What is a mathematical model of a dynamic system?",["A physical prototype of the system","A set of equations representing the system dynamics","A computer program only","A graphical representation only"],1],
["Which statement about mathematical models is correct?",["Every system has only one mathematical model","A mathematical model must always be nonlinear","A system can be represented in many different ways","Mathematical models cannot represent dynamic systems"],2],
["Which of the following systems can be described using differential equations?",["Mechanical systems only","Electrical systems only","Thermal systems only","Mechanical, electrical, thermal, economic, and biological systems"],3],
["Differential equations describing systems can be:",["Only linear","Only nonlinear","Linear or nonlinear","Neither linear nor nonlinear"],2],
["Some nonlinear systems can be:",["Removed completely","Linearized","Made time-invariant automatically","Converted directly into digital systems"],1],
["A system is linear if:",["Its coefficients change with time","Superposition holds","It contains nonlinear terms","Its output is always zero"],1],
["What is the main physical meaning of time invariance?",["The input never changes","The output never changes","The system itself does not change with time","The system must be linear"],2],
["A circuit with fixed R, L, and C is considered:",["Nonlinear","Time-varying","Time-invariant","Discrete-time"],2],
["A circuit with a variable capacitance C is:",["Time-invariant","Time-varying","Always nonlinear","Always unstable"],1],
["A continuous-time system described by a linear differential equation with constant coefficients is:",["Nonlinear time-varying","LTI","Discrete-time nonlinear","Improper"],1],
["Constant coefficients in a differential equation indicate:",["Linearity","Time invariance","Instability","Feedback"],1],
["The absence of nonlinear terms indicates:",["Time invariance","Linearity","Instability","Feedback"],1],
["Which combination defines an LTI system?",["Nonlinear + time-varying","Linear + time-varying","Nonlinear + time-invariant","Linear + time-invariant"],3],
["Why is the Laplace transform useful in control systems?",["It converts algebraic equations into physical systems","It converts differential equations into algebraic equations","It eliminates all initial conditions","It converts every system into a nonlinear system"],1],
["The Laplace transform generally converts a problem from:",["Frequency domain to time domain","Time domain to the s-domain / frequency-domain representation","Physical domain to mechanical domain","Digital domain to analog domain"],1],
["After applying the Laplace transform, the original differential equation becomes:",["A graphical equation","An algebraic equation in s","A nonlinear equation only","A state-space equation only"],1],
["To obtain a time-domain solution after solving in the s-domain, we use:",["Laplace transform","Fourier transform","Inverse Laplace transform","Partial differentiation"],2],
["The Laplace transform is particularly useful when:",["There are no inputs","The system has initial conditions and an input is applied at t = 0","The system is always nonlinear","The output is unknown but the input is zero"],1],
["For an input applied at t = 0, the lecture states:",["x(t) = 1 for t < 0","x(t) = 0 for t < 0","x(t) = t for t < 0","x(t) = ∞ for t < 0"],1],
["The inverse Laplace transform converts:",["f(t) → F(s)","F(s) → f(t)","G(s) → H(s)","R(s) → C(s)"],1],
["A ratio of two polynomials in s is called a:",["Differential equation","Rational function","State variable","Time constant"],1],
["Why is Partial Fraction Expansion useful?",["To make a complicated rational function easier to inverse-transform","To make a system nonlinear","To eliminate the transfer function","To change a time-invariant system into a time-varying system"],0],
["Partial Fraction Expansion breaks a complicated rational function into:",["More complicated differential equations","Simpler forms that can be matched with Laplace tables","Physical components","State variables only"],1],
["Which sequence correctly describes solving an LTI differential equation using Laplace transforms?",["Inverse Laplace → Laplace → rearrange","Laplace → rearrange → inverse Laplace","Rearrange → inverse Laplace → Laplace","Laplace → differentiate → integrate"],1],
["In the first step of solving an LTI differential equation, we:",["Find the poles","Take the Laplace transform of each term","Draw a block diagram","Find the feedback gain"],1],
["In the second step, we:",["Find the physical structure","Obtain the expression for the Laplace transform of the dependent variable","Convert the system to state-space","Find the input experimentally"],1],
["In the third step, we:",["Find the inverse Laplace transform","Apply another Laplace transform","Change the coefficients","Linearize the system"],0],
["What is the characteristic equation?",["G(s) = 0","H(s) = 0","aₙsⁿ + aₙ₋₁sⁿ⁻¹ + … + a₁s + a₀ = 0","C(s) = R(s)"],2],
["The roots of the characteristic equation are the system's:",["Zeros","Inputs","Poles","Outputs"],2],
["For non-repeated poles, the zero-input response can be written as:",["y(t) = ΣC_k e^(s_k t)","y(t) = G(s)H(s)","y(t) = R(s) − C(s)","y(t) = A(s) + B(s)"],0],
["The coefficients C₁, C₂, …, Cₙ in the zero-input response are obtained from:",["Transfer function degree","Initial conditions","Feedback gain only","Input frequency only"],1],
["The zero-input response is also called the:",["Particular response","Forced response","Homogeneous response","Frequency response"],2],
["A system is stable if its homogeneous response:",["Goes to infinity","Remains constant for all conditions","Converges to zero for all initial conditions","Oscillates forever"],2],
["For a stable system, all poles should have:",["Positive real parts","Zero real parts","Negative real parts","Infinite real parts"],2],
["A transfer function is:",["A physical component","A mathematical model of a system","An input signal","A type of sensor"],1],
["The transfer function is a property of:",["The input signal only","The system","The initial condition only","The measurement instrument only"],1],
["The transfer function is:",["Dependent on the particular input signal","Independent of the input signal","Independent of the system","Always dependent on temperature"],1],
["A transfer function does NOT provide information about:",["The mathematical input-output relationship","The physical structure of the system","The system model","The system response to inputs"],1],
["If the transfer function is known, we can:",["Study the output for different inputs","Determine the physical construction exactly","Guarantee instability","Remove the system poles"],0],
["If a transfer function is unknown, it can be identified experimentally by:",["Changing the physical structure randomly","Applying known inputs and studying the output","Removing the input","Ignoring the output"],1],
["A transfer function is strictly proper when: (n = denominator degree, m = numerator degree)",["n < m","n = m","n > m","n = 0"],2],
["A transfer function is proper when: (n = denominator degree, m = numerator degree)",["n > m","n = m","n < m","m = 0"],1],
["A transfer function is improper when: (n = denominator degree, m = numerator degree)",["n > m","n = m","n < m","n = 1"],2],
["Physical systems are generally:",["Improper only","Proper or strictly proper","Always improper","Neither proper nor improper"],1],
["In a block diagram, a subsystem can be represented by a block containing:",["Only an input","Only an output","Input, output, and transfer function","Only a feedback signal"],2],
["In cascade form, interconnected subsystems are assumed to:",["Load adjacent subsystems","Not load adjacent subsystems","Always be nonlinear","Have zero transfer functions"],1],
["Which MATLAB command represents a series/cascade connection?",["parallel(G1,G2)","feedback(G,H,±1)","series(G1,G2)","laplace(G1,G2)"],2],
["Which MATLAB command represents a parallel connection?",["series(G1,G2)","parallel(G1,G2)","feedback(G,H,±1)","inverse(G1,G2)"],1],
["For a negative-feedback system, the closed-loop transfer function is:",["G(s) / (1 − G(s)H(s))","H(s) / (1 + G(s))","G(s) / (1 + G(s)H(s))","G(s) + H(s)"],2],
["In the potentiometer case study, when the potentiometer is at the center position:",["Output voltage is +10 V","Output voltage is −10 V","Output voltage is zero","Output voltage is infinite"],2],
["What is the primary purpose of a control system?", ["To increase the physical size of a system", "To obtain a desired output with desired performance", "To eliminate all sensors", "To operate only mechanical systems"], 1],
["Which component is the system or group of components being controlled?", ["Controller", "Sensor", "Process", "Actuator"], 2],
["Which component is responsible for controlling the process?", ["Controller", "Process", "Disturbance", "Reference"], 0],
["What does the term feedback refer to?", ["Increasing the input without measuring the output", "Connecting systems so that they influence each other", "Removing the controller from a system", "Applying power directly to the output"], 1],
["Which statement correctly describes an open-loop control system?", ["The output affects the control action", "The output is continuously compared with the reference", "The output has no effect on the control action", "It always rejects disturbances"], 2],
["Which of the following is an example of an open-loop system mentioned in the lecture?", ["Tachometer speed control", "Washing machine", "Blood glucose regulation", "ABS"], 1],
["Why are open-loop systems sensitive to disturbances?", ["They have too many sensors", "They continuously measure disturbances", "They cannot use output feedback to correct their effects", "They always have excessive gain"], 2],
["Which characteristic is generally associated with a closed-loop system?", ["No output measurement", "No error correction", "Feedback of the measured output", "Complete insensitivity to every disturbance"], 2],
["A closed-loop system compares the measured output with:", ["The disturbance", "The desired/reference output", "The actuator power", "The sensor noise only"], 1],
["Compared with open-loop systems, closed-loop systems are generally:", ["Less accurate", "More sensitive to disturbances", "More accurate and relatively insensitive to disturbances", "Unable to correct errors"], 2],
["In the rotating-disc speed example, what happens in the open-loop system when speed changes unexpectedly?", ["The error is automatically corrected", "The speed error is not corrected", "The tachometer immediately compensates", "The system becomes closed-loop"], 1],
["What is the main role of a tachometer in the closed-loop speed-control example?", ["To provide feedback related to speed", "To eliminate the controller", "To increase the disturbance", "To replace the actuator"], 0],
["Which is an advantage of control systems?", ["Reduced precision", "High-precision performance", "Elimination of all disturbances", "Elimination of all system components"], 1],
["Control systems can provide:", ["Power gain", "Only mechanical gain", "Only temperature gain", "No gain at all"], 0],
["Why are control systems useful in remote or dangerous locations?", ["They eliminate the need for electricity", "They allow control/operation where human access may be difficult or dangerous", "They always operate without sensors", "They only work in laboratories"], 1],
["What is meant by compensation for disturbances?", ["Ignoring disturbances", "Producing the correct output despite disturbances", "Increasing disturbances", "Removing the process"], 1],
["The historical water-clock example demonstrates the control of:", ["Motor speed", "Temperature", "Water level", "Vehicle position"], 2],
["In the water-level example, the float valve helps:", ["Maintain the regulating tank at a constant level", "Increase water disturbances", "Eliminate water flow", "Measure temperature"], 0],
["Which of the following is an example of a modern control application?", ["Mars rover", "Mechanical ruler", "Ordinary chair", "Passive book"], 0],
["Which of the following is NOT listed as an active safety control for automobiles?", ["ABS", "Traction Control", "Electronic Stability Control", "Manual transmission"], 3],
["What is one of the main objectives of ABS?", ["Increase wheel locking", "Minimize stopping distance under braking", "Eliminate vehicle control", "Increase uncontrolled braking"], 1],
["Why does ABS aim to prevent wheel locking?", ["To maintain vehicle drivability", "To increase stopping distance", "To eliminate braking", "To increase wheel speed indefinitely"], 0],
["Blood/sugar regulation is an example of:", ["A biological control system", "An open-loop mechanical system", "An industrial actuator only", "A feedforward-only system"], 0],
["When glucose level rises, the body releases:", ["Glucagon", "Insulin", "Oxygen", "Water"], 1],
["When glucose levels are low, the pancreas secretes:", ["Insulin", "Glucagon", "Water", "Adrenaline"], 1],
["Which of the following is an advantage of feedback control?", ["It can make a system more robust to external influences", "It always causes instability", "It always increases sensor noise", "It eliminates the need for a controller"], 0],
["Feedback can make a system less sensitive to:", ["External disturbances and variations in individual elements", "Only the reference signal", "Only the controller", "Nothing"], 0],
["Feedback can sometimes be used to create:", ["Nonlinear behavior from linear components only", "Linear behavior from nonlinear components", "Random behavior", "Uncontrolled behavior"], 1],
["Which is a potential disadvantage of feedback?", ["Increased robustness", "Improved modularity", "Dynamic instability", "Better disturbance rejection"], 2],
["Poorly designed feedback can result in:", ["Oscillations or runaway behavior", "Perfect stability", "Zero sensor noise", "No dynamic response"], 0],
["Why can feedback introduce sensor noise?", ["Because the measured signal is fed back into the system", "Because feedback eliminates sensors", "Because the controller is removed", "Because the reference is always zero"], 0],
["Which of the following is one of the main goals of a control system?", ["Stability", "Complexity", "Noise", "Oscillation"], 0],
["What does stability mean in the context of the lecture?", ["The system responds as slowly as possible", "The system maintains the desired operating point", "The system always changes its operating point", "The system ignores its output"], 1],
["What does performance refer to?", ["How rapidly the system responds to changes", "How large the controller is", "How many sensors are installed", "How much noise the system produces"], 0],
["What does robustness mean?", ["The ability to tolerate perturbations or uncertainty in system dynamics", "The ability to eliminate all sensors", "The ability to increase disturbances", "The ability to operate only at one exact condition"], 0],
["A vehicle experiences changes in mass and aerodynamic drag. Which control-system property is particularly important?", ["Robustness", "Oscillation", "Open-loop operation", "On-off switching"], 0],
["Feedback can be used to change:", ["Only the input", "The dynamics/behavior of a system", "Only the physical dimensions", "Only the sensor type"], 1],
["According to the lecture, feedback can potentially:", ["Stabilize unstable systems", "Make every system unstable", "Eliminate all system dynamics", "Prevent any response to inputs"], 0],
["A sluggish system can potentially be made more responsive through:", ["Feedback", "Removing the controller", "Removing the output", "Open-loop operation only"], 0],
["What is one benefit of modularity through feedback?", ["A complex system can be divided into subsystems with clear input/output behavior", "Every component must be redesigned simultaneously", "Components cannot be replaced", "The system becomes impossible to maintain"], 0],
["A modular system is advantageous because:", ["Changing one component may not require redesigning the entire system", "Every component must be permanently fixed", "It eliminates all feedback", "It prevents system upgrades"], 0],
["What is the simplest type of feedback control discussed in the lecture?", ["PID", "On-off control", "Integral control", "Derivative control"], 1],
["On-off control is also known as:", ["Continuous control", "Bang-bang control", "Adaptive control", "Linear control"], 1],
["How many controller output states does basic on-off control have?", ["One", "Two", "Three", "Infinitely many"], 1],
["In an on-off heating system, when room temperature falls below the setpoint, the furnace:", ["Turns off", "Turns on", "Does nothing permanently", "Changes to proportional control"], 1],
["Why does on-off control often produce temperature oscillations?", ["The controller changes the actuated variable over the full range in response to relatively small errors", "The controller never changes its output", "The sensor is always disconnected", "The system has no setpoint"], 0],
["What is the main idea behind proportional control?", ["The control output changes proportionally to the error", "The control output has only two states", "The output never changes", "The system ignores the error"], 0],
["In proportional control, what happens when the error becomes larger?", ["The controller response becomes larger", "The controller response becomes zero", "The controller always turns completely off", "The controller stops measuring"], 0],
["What are the three components represented by PID?", ["Position, Input, Disturbance", "Proportional, Integral, Derivative", "Process, Input, Dynamics", "Power, Insulation, Design"], 1],
["According to the lecture, why are many industrial controllers actually PI rather than full PID controllers?", ["Derivative action is often not included", "Proportional action is never used", "Integral action cannot be used", "PID cannot be used in industry"], 0]
];
const L="ABCD",N=15;
const quiz=document.getElementById("quiz"),sc=document.getElementById("score");
let set=[];
function gen(){
  const a=B.map((_,i)=>i);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  set=a.slice(0,N).map(i=>B[i]);ans=0;cor=0;upd();sc.hidden=false;quiz.textContent="";
  set.forEach((q,i)=>{
    const d=document.createElement("div");d.className="q";
    const h=document.createElement("h3"),s=document.createElement("span");
    s.textContent=(i+1)+".";h.append(s,q[0]);d.append(h);
    q[1].forEach((t,k)=>{
      const l=document.createElement("label"),r=document.createElement("input");
      r.type="radio";r.name="q"+i;r.value=k;
      r.onchange=()=>grade(i,k);l.append(r,L[k]+". "+t);d.append(l);
    });
    quiz.append(d);
  });
  window.scrollTo(0,0);
}
let ans=0,cor=0;
function upd(fin){
  sc.textContent=fin?("Finished! Final score: "+cor+" / "+N+" ("+Math.round(cor/N*100)+"%)"):("Answered "+ans+" / "+N+" · Correct "+cor);
}
function grade(i,k){
  const q=set[i],d=quiz.children[i],ls=d.querySelectorAll("label");
  ls.forEach(l=>l.querySelector("input").disabled=true);
  ls[q[2]].classList.add("ok");
  const m=document.createElement("div");m.className="n";
  ans++;
  if(k===q[2]){cor++;m.textContent="✓ Correct!"}
  else{ls[k].classList.add("no");m.textContent="✗ Incorrect — correct answer: "+L[q[2]]+". "+q[1][q[2]]}
  d.append(m);upd(ans===N);
}
document.getElementById("new").onclick=gen;
gen();
</script>
</body>
</html>
